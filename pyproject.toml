[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipoe-forge"
version = "0.1.0"
description = "Automated IPOE map asset builder — downloads DEM, imagery, basemap tiles, hydrology, and terrain analysis into a portable GeoPackage."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "numpy>=1.24",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "fiona>=1.9",
    "elevation>=1.1",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mgrs>=1.2",
    "military-symbol>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ipoe = "ipoe_forge.__main__:cli"

[tool.setuptools.packages.find]
include = ["ipoe_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
